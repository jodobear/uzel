[workspace]
members = [
  "apps/uzel/src-tauri",
  "apps/uzel-napd",
  "crates/napd",
  "crates/napd-protocol",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
base64 = "0.22.1"
napd = { path = "crates/napd" }
napd-protocol = { path = "crates/napd-protocol" }
nmp-native-nap-bridge = { git = "https://github.com/jodobear/nampplets", rev = "e2f69f325a6b45213accdacfcc125e80e0687b4c" }
nmp-native-provider-resource = { git = "https://github.com/jodobear/nampplets", rev = "e2f69f325a6b45213accdacfcc125e80e0687b4c" }
nmp-native-runtime-core = { git = "https://github.com/jodobear/nampplets", rev = "e2f69f325a6b45213accdacfcc125e80e0687b4c" }
nmp-native-runtime-ffi = { git = "https://github.com/jodobear/nampplets", rev = "e2f69f325a6b45213accdacfcc125e80e0687b4c" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
tauri = { version = "=2.11.5" }
tauri-build = { version = "=2.6.3" }
thiserror = "2.0.11"
tokio = { version = "=1.53.1", features = ["net", "rt-multi-thread", "time"] }
url = "=2.5.8"
