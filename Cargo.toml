[workspace]
members = [
  "apps/uzel/src-tauri",
  "apps/uzel-napd",
  "crates/napd",
  "crates/napd-protocol",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
base64 = "0.22.1"
napd = { path = "crates/napd" }
napd-protocol = { path = "crates/napd-protocol" }
nmp-native-runtime-ffi = { git = "https://github.com/jodobear/nampplets", rev = "e539378ef735ce06651fd94b71e06f9ce757cb13" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
tauri = { version = "=2.11.5" }
tauri-build = { version = "=2.6.3" }
thiserror = "2.0.11"
url = "=2.5.8"
