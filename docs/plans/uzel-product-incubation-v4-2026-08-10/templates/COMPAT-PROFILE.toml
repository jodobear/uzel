# Canonical machine-readable Uzel Runtime Compatibility Profile (RCP).
# This file is illustrative. M0 defines the validated schema and generates a human
# rendering from the canonical machine record. Never hand-maintain two authorities.

schema_version = 1
profile_id = "uzel-linux-<date>-<sequence>"
profile_hash_scheme = "sha256-exact-utf8-bytes-v1"
# The profile does not contain its own digest. The package manifest/compiled expected
# digest binds these exact UTF-8 bytes. BOM is forbidden; line endings are LF.
status = "experimental" # experimental | candidate | supported | superseded
created_at = "YYYY-MM-DDTHH:MM:SSZ"
owner = "<owner>"
uzel_git_commit = "<40-hex commit>"
uzel_tree = "<40-hex tree>"
nix_derivation = "<drv path or derivation digest>"
supported_trust_tiers = ["first_party_exact", "vetted_external_exact"]
previous_profile = ""
transition_record = "<machine-readable old-to-new transition record or none>"

[identity]
manifest_profile = "<exact interpretation id>"
manifest_kinds = [35129]
aggregate_rule = "<exact rule id>"
source_binding = "<source/publisher/build rule>"
update_identity = "<update/revocation rule>"

[[sources]]
id = "nostr-nip-5a"
role = "spec"
repo = "https://github.com/nostr-protocol/nips"
ref_kind = "commit"
commit = "<40-hex commit>"
tree = "<40-hex tree>"
path = "5A.md"
content_sha256 = "<64-hex digest>"
retrieved_at = "YYYY-MM-DDTHH:MM:SSZ"
status_at_pin = "draft"

[[sources]]
id = "napplet-projection"
role = "proposal"
repo = "<canonical repository>"
ref_kind = "pull_request_commit"
proposal = "<PR or proposal id>"
commit = "<40-hex commit>"
tree = "<40-hex tree>"
path = "<path>"
content_sha256 = "<64-hex digest>"
retrieved_at = "YYYY-MM-DDTHH:MM:SSZ"
status_at_pin = "open"

[[dependencies]]
id = "canonical-nostr-engine"
role = "library"
source = "<repository or registry>"
version = "<exact version when applicable>"
commit = "<40-hex commit when applicable>"
source_sha256 = "<64-hex digest>"
lock_source = "Cargo.lock"
local_patch = ""

[[domains]]
name = "shell"
contract = "NAP-SHELL"
revision = "<source id + commit/path digest>"
requirement = "runtime_required"
status = "enabled"
operations = ["supports", "profile"]
limits_profile = "shell-v1"

[[domains]]
name = "relay"
contract = "NAP-RELAY"
revision = "<source id + commit/path digest>"
requirement = "guest_optional"
status = "profiled_draft"
operations = ["query", "subscribe"]
limits_profile = "relay-read-v1"

[negotiation]
protocol_version = 1
required_missing = "reject_before_guest_code"
optional_missing = "explicit_unsupported"
unknown_domain = "unsupported"
implicit_downgrade = false
mid_session_profile_change = false
transcript_hash = "sha256-canonical-cbor-v1"

[interop]
compat_kit = "<exact compatibility-kit manifest digest>"
clean_room_fixture = "<exact external-source fixture/build id>"
independent_napplet = "<exact independent source/build id or blocked_no_independent_peer>"
fixture_set = "<exact fixture manifest digest>"
previous_profile_window = "<profile id or none>"

[deviations]
records = ["SIR-####"]

[evidence]
contract_report = "<path + digest>"
interop_report = "<path + digest>"
version_skew_report = "<path + digest>"
native_report = "<path + digest>"

[release]
channel = "candidate" # candidate | canary | stable | superseded | quarantined
release_manifest = "<signed immutable release manifest or blocked>"
update_mode = "explicit_review" # no silent byte/profile substitution
silent_substitution = false
supported_from = ""
supported_until = ""
security_policy = "<path or blocked>"
previous_green_profile = ""
canary_policy = "<opt-in policy or not_applicable>"
rollback_policy = "<path or blocked>"
