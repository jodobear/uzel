# Canonical machine-readable upstream registry template.
# One entry per watched specification, proposal, library, tool or provider.

schema_version = 1
generated_at = "YYYY-MM-DDTHH:MM:SSZ"

[[upstreams]]
id = "<stable-local-id>"
role = "spec" # spec | proposal | library | tool | provider | conformance | platform | orchestration
canonical_repo = "<url>"
canonical_path = "<path or package>"
contribution_route = "issue_first" # no_action | comment_existing | issue_first | pr_ok | private_security
contribution_rationale = "<required rationale, especially for no_action>"
security_route = "<SECURITY.md/contact or none>"
license = "<SPDX or review_required>"

[upstreams.pin]
ref_kind = "commit" # commit | tag | release | package
ref_name = "<human label>"
commit = "<40-hex commit when git>"
tree = "<40-hex tree when git>"
content_sha256 = "<path/package/content digest>"
package_integrity = "<registry integrity or Nix source hash>"
retrieved_at = "YYYY-MM-DDTHH:MM:SSZ"

[upstreams.observation]
watch = true
cadence = "milestone_and_event"
last_scanned_at = "YYYY-MM-DDTHH:MM:SSZ"
latest_seen_revision = "<provider-specific immutable revision>"
change_class = "none" # none | editorial | additive | behavioral | security | removal
urgency = "normal" # normal | next_campaign | immediate_stop
owner = "<owner>"
record = "<UPR id or none>"

[upstreams.candidate_next]
enabled = true
last_probed_at = ""
observed_revision = "<provider-specific immutable revision or empty>"
observed_content_sha256 = "<digest or empty>"
probe_profile = "<ephemeral profile id or empty>"
result = "not_run" # not_run | green_advisory | changed | blocked_high_risk | failed_harness
change_class = "none"
evidence = "<path/digest or none>"
promotion_allowed = false
secrets_allowed = false
production_lock_mutation_allowed = false
