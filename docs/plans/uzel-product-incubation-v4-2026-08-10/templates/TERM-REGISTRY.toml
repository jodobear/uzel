schema_version = 1
registry_id = "uzel-canonical-terms-v1"
status = "template"
last_reviewed = "YYYY-MM-DD"

# Validator rules: term_id values are unique; every replaced_by and supersedes target
# references an existing term_id; each relationship has its reciprocal inverse. Every
# superseded term has at least one replaced_by ID. Self-references and replacement cycles
# are invalid. Non-superseded terms may keep replaced_by empty.

[[term]]
term_id = "term.example"
label = "preferred label"
aliases = ["legacy label"]
deprecated_aliases = []
definition = "One precise cross-component meaning."
not_definition = "A nearby meaning that must not be conflated."
owner = "component-or-record-owner"
status = "active" # active | deprecated | superseded
profiles = ["profile-id-or-all"]
capabilities = ["capability-id"]
sources = ["immutable-source-or-evidence-id"]
supersedes = []
replaced_by = []
last_reviewed = "YYYY-MM-DD"
reviewer = "named-human-or-role"
