<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Direct follows</title>
    <style>
      :root { color-scheme: dark; font: 14px/1.45 ui-monospace, monospace; background: #10120f; color: #edf4e8; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px; }
      h1 { margin: 0 0 4px; font-size: 18px; }
      #status { color: #aab5a4; margin: 0 0 12px; }
      ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
      button { width: 100%; padding: 9px 10px; border: 1px solid #44503f; border-radius: 5px; background: #171c15; color: inherit; text-align: left; font: inherit; cursor: pointer; }
      button:focus-visible { outline: 2px solid #9be564; outline-offset: 2px; }
      button:hover { border-color: #9be564; }
    </style>
  </head>
  <body>
    <h1>Direct follows</h1>
    <p id="status" role="status">Waiting for runtime…</p>
    <ul id="follows" aria-label="Direct follows"></ul>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
