<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Direct follows</title>
    <style>
      :root { color-scheme: dark; font: 14px/1.45 ui-monospace, monospace; background: #10120f; color: #edf4e8; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      h1 { margin: 0; font-size: 18px; }
      #status { color: #aab5a4; margin: 0 0 12px; }
      ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
      button { width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid #44503f; border-radius: 5px; background: #171c15; color: inherit; text-align: left; font: inherit; cursor: pointer; display: flex; align-items: center; gap: 10px; }
      header button { width: auto; padding: 5px 8px; font-size: 12px; }
      button:focus-visible { outline: 2px solid #9be564; outline-offset: 2px; }
      button:hover { border-color: #9be564; }
      .avatar { width: 36px; height: 36px; flex: 0 0 36px; border-radius: 50%; overflow: hidden; background: #293126; display: grid; place-items: center; }
      .avatar img { width: 100%; height: 100%; object-fit: cover; }
      .avatar-fallback { color: #9be564; font-weight: 700; }
      .follow-details { min-width: 0; display: grid; gap: 1px; }
      .follow-name, .follow-pubkey { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .follow-name { font-weight: 700; }
      .follow-pubkey { color: #aab5a4; font-size: 12px; }
    </style>
  </head>
  <body>
    <header><h1>Direct follows</h1><button id="refresh" type="button">Reload</button></header>
    <p id="status" role="status">Waiting for runtime…</p>
    <ul id="follows" aria-label="Direct follows"></ul>
    <template id="follow-row">
      <li>
        <button type="button">
          <span class="avatar">
            <img alt="" hidden />
            <span class="avatar-fallback" aria-hidden="true">?</span>
          </span>
          <span class="follow-details">
            <span class="follow-name"></span>
            <span class="follow-pubkey"></span>
          </span>
        </button>
      </li>
    </template>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
